name: forged4life
description: Forged 4 Life — SkillsForge360 membership.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.3                    # card token — must match CardTokenService.php
  flutter_secure_storage: ^9.2.2    # card secret → Android Keystore
  qr_flutter: ^4.1.0                # renders the rotating code
  screen_brightness: ^1.0.1         # full brightness while the QR is showing
  http: ^1.2.2
  google_fonts: ^6.2.1              # Montserrat
  url_launcher: ^6.3.1              # register-interest links
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
